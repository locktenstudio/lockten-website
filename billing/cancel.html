<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subscription canceled · Walkthrough</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background: #fdfbf7; }
    .card {
      max-width: 480px;
      margin: 12vh auto 0;
      padding: 32px 28px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(40, 25, 0, 0.06);
      text-align: center;
    }
    .icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #f0f0f0;
      color: #888;
      font-size: 28px;
      line-height: 60px;
      margin: 0 auto 16px;
    }
    h1 { color: #413000; font-size: 26px; margin: 0 0 8px; }
    p { color: #555; line-height: 1.55; margin: 0 0 18px; }
    .open-btn {
      display: inline-block;
      background: #5D87A1;
      color: #fff;
      padding: 12px 26px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    .footnote { font-size: 13px; color: #888; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x2715;</div>
    <h1>Checkout canceled</h1>
    <p>
      No charge was made. You can subscribe any time from Settings in
      the Walkthrough app.
    </p>
    <a class="open-btn" href="walkthrough://billing/cancel">
      Open Walkthrough
    </a>
  </div>
</body>
</html>
