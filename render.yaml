# Render Static Site config. The existing service was created via
# the dashboard, not a blueprint, so this file is informational on
# first deploy. Adding it makes future redeploys reproducible and
# lets Render apply the headers block via blueprint sync.
#
# If headers don't take effect after this file lands (Render may
# require manual dashboard sync for non-blueprint-bound services),
# configure them through the dashboard:
#   Settings -> Headers -> Add Header
#     Path: /.well-known/apple-app-site-association
#     Header: Content-Type
#     Value: application/json
#
# The _headers file at the repo root is also there as a fallback
# in case Render's Netlify-compat layer picks it up first.

services:
  - type: web
    name: lockten-website
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    headers:
      # Universal Links require Content-Type: application/json or iOS
      # silently rejects the AASA file. Render's default for files
      # with no extension is application/octet-stream, which won't work.
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
      - path: /.well-known/apple-app-site-association
        name: Cache-Control
        value: public, max-age=3600

  # ------------------------------------------------------------------
  # Walkthrough's own domain: https://sitewalkthrough.com/
  #
  # Same repo, second static site, the pattern the `materialmonitor`
  # service uses for materialmonitor.app. The build command copies
  # sitewalkthrough.html over index.html so that page IS the root of this
  # host (a rewrite rule alone does not work, because Render serves an
  # existing file first), then writes this host's own robots.txt and
  # sitemap.xml over the lockten.ai ones.
  #
  # The sitemap lists ONE url. sitewalkthrough.html is the only page this
  # host owns; help, the sample report, privacy and terms are lockten.ai's
  # pages and every link on the product page points at them there. They
  # still resolve here, because the whole repo is published either way,
  # but they are not advertised and their canonicals stay on lockten.ai.
  #
  # Like `lockten-website` and `materialmonitor`, this service is created
  # in the Render dashboard, so this entry is documentation and a paste
  # source until a blueprint sync binds it.
  # ------------------------------------------------------------------
  - type: web
    name: sitewalkthrough
    runtime: static
    branch: main
    buildCommand: |-
      cp sitewalkthrough.html index.html && cp robots-sitewalkthrough.txt robots.txt && cp sitemap-sitewalkthrough.xml sitemap.xml && cp llms-sitewalkthrough.txt llms.txt
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    headers:
      # Carried over from the studio site. The app's associated domain is
      # lockten.ai today, so nothing deep-links to this host yet, but if
      # that ever moves the AASA has to be served as application/json or
      # iOS silently ignores it.
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
      - path: /.well-known/apple-app-site-association
        name: Cache-Control
        value: public, max-age=3600

  # ------------------------------------------------------------------
  # Material Monitor's own domain: https://materialmonitor.app/
  #
  # Same repo, third static site. The build command copies the product
  # page over index.html and the product's legal pages over privacy.html
  # and terms.html, then copies this host's own crawler files over the
  # studio ones: robots-materialmonitor.txt, sitemap-materialmonitor.xml
  # (with lastmod dates; bump the home page's date when the page changes)
  # and llms-materialmonitor.txt (the product's own description for AI
  # readers). Edit those three files in the repo, never the build command.
  #
  # Created in the Render dashboard like the others, so this entry is
  # documentation and the paste source for the build command.
  # ------------------------------------------------------------------
  - type: web
    name: materialmonitor
    runtime: static
    branch: main
    buildCommand: |-
      cp materialmonitor.html index.html && cp materialmonitor-privacy.html privacy.html && cp materialmonitor-terms.html terms.html && cp robots-materialmonitor.txt robots.txt && cp sitemap-materialmonitor.xml sitemap.xml && cp llms-materialmonitor.txt llms.txt
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
